<!DOCTYPE html>
  <html lang="pt-BR">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>75LAB — Projetos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0a0a0a;
    color: #f5f5f5;
        min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    overflow: hidden;
}
  .bg {
        position: fixed; inset: 0;
    background:
          radial-gradient(circle at 20% 20%, rgba(255,90,0,0.18), transparent 45%),
                  radial-gradient(circle at 80% 80%, rgba(0,120,255,0.14), transparent 45%);
    z-index: 0;
}
  .card { position: relative; z-index: 1; max-width: 560px; }
  .logo {
        font-size: clamp(56px, 14vw, 120px);
    font-weight: 800;
    letter-spacing: -3px;
    line-height: 1;
    background: linear-gradient(135deg, #ffffff 0%, #ff5a00 100%);
          -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}
  .tag {
        margin-top: 18px;
    font-size: clamp(15px, 3vw, 19px);
    color: #a3a3a3;
        font-weight: 400;
    letter-spacing: 0.5px;
}
  .line {
        width: 60px; height: 3px;
    background: #ff5a00;
        margin: 32px auto;
    border-radius: 2px;
  }
  .note {
        font-size: 14px;
    color: #737373;
    line-height: 1.6;
}
  .foot {
        position: fixed; bottom: 24px; left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    color: #525252;
    z-index: 1;
}
</style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="card">
      <div class="logo">75LAB</div>
      <div class="tag">Hub de projetos</div>
    <div class="line"></div>
    <p class="note">Este é o endereço institucional dos projetos da 75LAB.<br>Acesse pelo link específico que a equipe compartilhou com você.</p>
  </div>
  <div class="foot">© 75LAB — 75lab.com.br</div>
</body>
</html>
