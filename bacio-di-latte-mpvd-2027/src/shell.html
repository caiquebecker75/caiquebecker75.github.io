<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="75LAB">
<title>{{TITLE}}</title>
<meta name="description" content="Proposta 75LAB para a Bacio di Latte · MPVD 2027: a mesma gelateria em 12 mil lugares.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..800;1,400..800&family=DM+Sans:wght@400;600;700&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1E140F;overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
.slide.on{opacity:1;visibility:visible}
.slide h1,.slide h2,.slide h3,.slide p,.slide ul{margin:0}
.slide ul{padding-left:1.1em}
.slide li{margin:0 0 .25em}
.slide a{color:inherit}
.slide hr{border:0;margin:0;width:100%}
.slide table{border-collapse:collapse;width:100%}
.slide th,.slide td{padding:.35em .6em;border-bottom:1px solid #D9CBB5;vertical-align:top;text-align:left}
.slide th{font-weight:700}
.notes{display:none}
#ui{position:fixed;right:20px;bottom:16px;display:flex;gap:8px;align-items:center;font:600 14px/1 "DM Sans",Arial,sans-serif;color:#E3D6C3;z-index:5;opacity:.75}
#ui button{width:36px;height:36px;border-radius:50%;border:1px solid #6B5A4E;background:#2B1D16;color:#F7F1E7;font-size:18px;cursor:pointer}
#ui button:hover{background:#4E3A2E}
#bar{position:fixed;left:0;bottom:0;height:4px;background:#8BA65A;transition:width .3s;z-index:5}
@media print{
  @page{size:1920px 1080px;margin:0}
  html,body{overflow:visible;height:auto;background:none}
  #stage{position:static;transform:none!important;width:auto;height:auto}
  .slide{position:relative;opacity:1;visibility:visible;page-break-after:always;break-after:page}
  #ui,#bar{display:none}
}
</style>
</head>
<body>
<div id="stage">
{{SLIDES}}
</div>
<div id="ui"><button id="prev" aria-label="Slide anterior">‹</button><span id="pos">1 / {{COUNT}}</span><button id="next" aria-label="Próximo slide">›</button></div>
<div id="bar"></div>
<script>
(function(){
  var s=[].slice.call(document.querySelectorAll('.slide')),n=s.length,i=0,st=document.getElementById('stage');
  function fit(){var k=Math.min(innerWidth/1920,innerHeight/1080);st.style.transform='scale('+k+') translate(-50%,-50%)';st.style.transformOrigin='0 0';st.style.left='50%';st.style.top='50%';st.style.transform='translate(-50%,-50%) scale('+k+')';st.style.transformOrigin='center center';}
  function go(k){i=Math.max(0,Math.min(n-1,k));s.forEach(function(e,j){e.classList.toggle('on',j===i)});document.getElementById('pos').textContent=(i+1)+' / '+n;document.getElementById('bar').style.width=((i+1)/n*100)+'%';history.replaceState(null,'','#s'+(i+1));}
  addEventListener('resize',fit);fit();
  function fromHash(){var m=/^#s(\d+)$/.exec(location.hash);go(m?+m[1]-1:0)}fromHash();addEventListener('hashchange',fromHash);
  addEventListener('keydown',function(e){var k=e.key;if(['ArrowRight','ArrowDown','PageDown',' '].indexOf(k)>-1){e.preventDefault();go(i+1)}else if(['ArrowLeft','ArrowUp','PageUp'].indexOf(k)>-1){e.preventDefault();go(i-1)}else if(k==='Home')go(0);else if(k==='End')go(n-1);});
  document.getElementById('next').onclick=function(){go(i+1)};document.getElementById('prev').onclick=function(){go(i-1)};
  var x0=null;addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)go(i+(dx<0?1:-1));x0=null});
})();
</script>
</body>
</html>
